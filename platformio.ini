; PlatformIO Project Configuration File
;
; Moon Phase - WiFi + NTP time + MET Norway moon API
; Targets: ESP32S NodeMCU or XIAO ESP32-C3 + GC9A01 240x240 round SPI display
; Credit to nishad2m8 https://github.com/nishad2m8
; !! IMPORTANT !!
; Select the environment matching your board and its display wiring.
; Wi-Fi, location, and time zone are configured through the setup access point.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.5.0
framework = arduino
extra_scripts = post:scripts/merge_firmware.py
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl @ 8.3.11
    bodmer/TFT_eSPI @ 2.5.43
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    ; ---- LVGL config ----
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DDISABLE_ALL_LIBRARY_WARNINGS

    ; ---- TFT_eSPI setup (build-flag method, no library files edited) ----
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=0          ; 1=BGR, 0=RGB -- flip this if colors look swapped

    -DTFT_BL=-1                ; backlight always on, no pin used
    -DTFT_MISO=-1              ; not used, display has no read pin wired

    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000

[env:esp32dev]
board = nodemcu-32s
build_flags =
    ${env.build_flags}
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=22
    -DTFT_DC=21
    -DTFT_RST=27

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -DTFT_MOSI=6
    -DTFT_SCLK=7
    -DTFT_CS=4
    -DTFT_DC=5
    -DTFT_RST=3
